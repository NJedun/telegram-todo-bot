<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Your personal to-do list manager">
  <meta name="theme-color" content="#2481cc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ToDo">

  <title>To-Do List</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📝</text></svg>">

  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Мой список дел</h1>
      <p class="subtitle" id="userInfo">Загрузка...</p>
      <div class="list-toggle">
        <button class="toggle-btn active" data-list="shared">📋 Активности</button>
        <button class="toggle-btn" data-list="goals">🎯 Цели</button>
      </div>
    </header>

    <div class="add-task-section">
      <div class="input-group">
        <input
          type="text"
          id="taskInput"
          placeholder="Добавить новую задачу..."
          autocomplete="off"
        >
        <button id="addBtn" class="add-btn">
          <span class="add-icon">+</span>
        </button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-filter="active">Активные</button>
      <button class="tab-btn" data-filter="completed">Завершенные</button>
      <button class="tab-btn" data-filter="all">Все</button>
    </div>

    <div class="tasks-container">
      <div id="tasksList" class="tasks-list">
        <!-- Tasks will be dynamically inserted here -->
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✨</div>
        <p>Пока нет задач!</p>
        <p class="empty-subtitle">Добавьте вашу первую задачу выше</p>
      </div>
    </div>

    <div class="stats">
      <span id="statsText">0 tasks</span>
    </div>
  </div>

  <script src="app.js"></script>

  <!-- Register Service Worker for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('Service Worker registered:', registration);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
